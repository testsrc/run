# testsrc for an app that plays through libvlc. Copy to .github/workflows/testsrc.yml.
# Needs a repository secret TESTSRC_TOKEN (a token from https://testsrc.com/account).
# The snapshot is pinned in testsrc.lock (written on the first run: commit it) and moved by the monthly update job
# (update-lock.yml).
name: testsrc (libvlc)
on:
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
# Pull requests: starter, the 10 general cases plus the ones testsrc's own matrix finds libvlc getting wrong. Every
# Monday: TESTSRC_WEEKLY, the starter cases and the ids after it, 30 different cases in all, which an evaluation
# token can fetch, also by hand (Actions > this workflow > Run workflow). Swap ids as you like (testsrc.com/cases).
# GitHub's hosted runners take at most 30 cases and 2 GB a job: every case (`all`, company tokens) goes on a
# self-hosted runner (README: "Fast checks on GitHub's runners, full runs on your own").
concurrency:
  group: testsrc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TESTSRC_WEEKLY: >-
    starter edge/anamorphic-sar-4-3.mp4 edge/audio-starts-500ms-late.mp4 edge/av1-hdr10.mkv
    edge/mka-opus-codec-delay.mka edge/mkv-no-cues.mkv edge/rotation-90-display-matrix.mp4
    edge/ts-pcr-wrap.ts edge/vfr-screen-recording.mp4 edge/wav-7.1-extensible.wav channels/5.1.mp4
jobs:
  testsrc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # GitHub's default is 6 hours; time-limit below stops the run 5 minutes before, keeping its report, where a job
    # killed at timeout-minutes loses it
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The libvlc your app ships. Here the distribution's; for your own build, point LIBVLC (Linux: the path of
      # libvlc.so.5) or VLC_DIR (Windows: the folder with libvlc.dll and plugins/) at it.
      - name: Install libvlc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc5 vlc-plugin-base
          else
            choco install vlc --no-progress -y
          fi
      - uses: testsrc/run@v1
        with:
          token: ${{ secrets.TESTSRC_TOKEN }}
          # minutes: the runner stops some minutes before timeout-minutes and keeps its report
          time-limit: 25
          player: libvlc
          set: ${{ github.event_name == 'pull_request' && 'starter' || env.TESTSRC_WEEKLY }}
          exclude: duration/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "testsrc-${{ matrix.os }}", path: testsrc-results/ }

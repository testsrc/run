# testsrc for an app that plays through libvlc. Copy to .github/workflows/testsrc.yml.
# Needs a repository secret TESTSRC_TOKEN (a token from https://testsrc.com/account).
# The snapshot is pinned in testsrc.lock (written on the first run: commit it) and moved by the monthly update job
# (update-lock.yml).
name: testsrc (libvlc)
on:
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
    inputs:
      set:
        description: "weekly: the weekly run's 30 cases. all: every case (company tokens only)."
        type: choice
        options: [weekly, all]
        default: weekly
# Pull requests: the 10 starter cases. Every Monday: TESTSRC_WEEKLY, the starter cases and 20 more, 30 different
# cases in all, which an evaluation token can fetch. Swap ids as you like (testsrc.com/cases). Every case (`all`)
# only by hand (Actions > this workflow > Run workflow), and only with a company token.
env:
  TESTSRC_WEEKLY: >-
    starter edge/anamorphic-sar-4-3.mp4 edge/audio-starts-500ms-late.mp4
    edge/av1-hdr10.mkv edge/hevc-yuv422.mp4 edge/low-fps-10.mp4
    edge/mka-opus-codec-delay.mka edge/mkv-forced-not-default-subs.mkv edge/mkv-no-cues.mkv
    edge/opus-5.1-family-1.opus edge/rotation-90-display-matrix.mp4 edge/single-frame-video.mp4
    edge/ts-pcr-wrap.ts edge/ts-starts-at-large-pts.ts edge/tx3g-cjk.mp4
    edge/vfr-screen-recording.mp4 edge/wav-7.1-extensible.wav dash/fmp4.mpd
    hls/abr-ladder.m3u8 channels/5.1.mp4 scan/1080i-tff.mp4
jobs:
  testsrc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # GitHub's default is 6 hours. 30 minutes, or 6 hours for every case (all); time-limit below stops the run
    # 5 or 10 minutes before, keeping its report, where a job killed at timeout-minutes loses it
    timeout-minutes: ${{ inputs.set == 'all' && 360 || 30 }}
    steps:
      - uses: actions/checkout@v4
      # The libvlc your app ships. Here the distribution's; for your own build, point LIBVLC (Linux: the path of
      # libvlc.so.5) or VLC_DIR (Windows: the folder with libvlc.dll and plugins/) at it.
      - name: Install libvlc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc5 vlc-plugin-base
          else
            choco install vlc --no-progress -y
          fi
      - uses: testsrc/run@v1
        with:
          token: ${{ secrets.TESTSRC_TOKEN }}
          # minutes: the runner stops some minutes before timeout-minutes and keeps its report
          time-limit: ${{ inputs.set == 'all' && 350 || 25 }}
          player: libvlc
          set: ${{ github.event_name == 'pull_request' && 'starter' || (github.event_name == 'workflow_dispatch' && inputs.set == 'all') && 'all' || env.TESTSRC_WEEKLY }}
          exclude: duration/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "testsrc-${{ matrix.os }}", path: testsrc-results/ }
